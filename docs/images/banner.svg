<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-labelledby="t d">
  <title id="t">Synkro</title>
  <desc id="d">Backup incremental, versionado e redundante para PDVs no Windows: a origem é copiada, conferida e gravada em vários cofres.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e1b4b"/>
      <stop offset="0.55" stop-color="#312e81"/>
      <stop offset="1" stop-color="#4338ca"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.5" r="0.45">
      <stop offset="0" stop-color="#818cf8" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#818cf8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.3" fill="#c7d2fe" fill-opacity="0.13"/>
    </pattern>
    <path id="p1" d="M842 160 C 930 160, 930 80, 1020 80"/>
    <path id="p2" d="M842 160 C 930 160, 930 160, 1020 160"/>
    <path id="p3" d="M842 160 C 930 160, 930 240, 1020 240"/>
    <style>
      .t { font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif; }
      .chip { fill: #c7d2fe; fill-opacity: 0.12; stroke: #a5b4fc; stroke-opacity: 0.35; }
      .chipt { fill: #e0e7ff; font-size: 15px; font-weight: 600; }
      .line { fill: none; stroke: #a5b4fc; stroke-width: 2.5; stroke-opacity: 0.75; }
      .halo { fill: none; stroke: #a5b4fc; stroke-width: 9; stroke-opacity: 0.12; }
      @keyframes spin { to { transform: rotate(360deg); } }
      .dial { transform-origin: 158px 160px; animation: spin 18s linear infinite; }
      @media (prefers-reduced-motion: reduce) { .dial { animation: none; } }
    </style>
  </defs>

  <rect width="1200" height="320" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="28" fill="url(#dots)"/>
  <rect width="1200" height="320" rx="28" fill="url(#glow)"/>

  <!-- Logo: porta de cofre -->
  <g>
    <rect x="68" y="70" width="180" height="180" rx="40" fill="#1e1b4b" stroke="#6366f1" stroke-opacity="0.5"/>
    <rect x="92" y="117" width="13" height="18" rx="3" fill="#818cf8"/>
    <rect x="92" y="185" width="13" height="18" rx="3" fill="#818cf8"/>
    <circle cx="158" cy="160" r="58" fill="#4f46e5"/>
    <circle class="dial" cx="158" cy="160" r="45" fill="none" stroke="#c7d2fe" stroke-width="4.5" stroke-dasharray="7 8"/>
    <circle cx="158" cy="160" r="20" fill="#1e1b4b"/>
    <line x1="158" y1="160" x2="173" y2="145" stroke="#c7d2fe" stroke-width="6.5" stroke-linecap="round"/>
  </g>

  <!-- Título -->
  <text class="t" x="290" y="124" fill="#ffffff" font-size="68" font-weight="800" letter-spacing="-1">Synkro</text>
  <text class="t" x="292" y="164" fill="#c7d2fe" font-size="22">Backup incremental, versionado e redundante</text>
  <text class="t" x="292" y="192" fill="#c7d2fe" font-size="22">para PDVs e dados críticos no Windows</text>

  <g class="t">
    <rect class="chip" x="292" y="216" width="146" height="34" rx="17"/>
    <text class="chipt" x="365" y="238" text-anchor="middle">SHA-256 em tudo</text>
    <rect class="chip" x="448" y="216" width="128" height="34" rx="17"/>
    <text class="chipt" x="512" y="238" text-anchor="middle">AES-256-GCM</text>
    <rect class="chip" x="586" y="216" width="104" height="34" rx="17"/>
    <text class="chipt" x="638" y="238" text-anchor="middle">VSS + dumps</text>
    <rect class="chip" x="700" y="216" width="112" height="34" rx="17"/>
    <text class="chipt" x="756" y="238" text-anchor="middle">pt-BR nativo</text>
  </g>

  <!-- Fluxo: origem → cofres -->
  <use href="#p1" class="halo"/><use href="#p2" class="halo"/><use href="#p3" class="halo"/>
  <use href="#p1" class="line"/><use href="#p2" class="line"/><use href="#p3" class="line"/>
  <circle cx="842" cy="160" r="9" fill="#a5b4fc"/>
  <circle cx="842" cy="160" r="4" fill="#1e1b4b"/>
  <g fill="#e0e7ff">
    <circle r="5"><animateMotion dur="2.6s" repeatCount="indefinite"><mpath href="#p1"/></animateMotion></circle>
    <circle r="5"><animateMotion dur="2.6s" begin="-0.9s" repeatCount="indefinite"><mpath href="#p2"/></animateMotion></circle>
    <circle r="5"><animateMotion dur="2.6s" begin="-1.7s" repeatCount="indefinite"><mpath href="#p3"/></animateMotion></circle>
  </g>

  <!-- Cofres -->
  <g class="t">
    <g transform="translate(1020 52)">
      <rect width="132" height="56" rx="12" fill="#1e1b4b" stroke="#4ade80" stroke-opacity="0.7"/>
      <path d="M16 30h26M19 30l3-10h14l3 10v8a1.5 1.5 0 0 1-1.5 1.5h-17A1.5 1.5 0 0 1 16 38z" fill="none" stroke="#4ade80" stroke-width="2.2" stroke-linejoin="round" transform="translate(0 -4)"/>
      <text x="54" y="25" fill="#fff" font-size="14" font-weight="700">HD rodízio</text>
      <text x="54" y="43" fill="#a5b4fc" font-size="12">sai do local</text>
    </g>
    <g transform="translate(1020 132)">
      <rect width="132" height="56" rx="12" fill="#1e1b4b" stroke="#4ade80" stroke-opacity="0.7"/>
      <path d="M16 30h26M19 30l3-10h14l3 10v8a1.5 1.5 0 0 1-1.5 1.5h-17A1.5 1.5 0 0 1 16 38z" fill="none" stroke="#4ade80" stroke-width="2.2" stroke-linejoin="round" transform="translate(0 -4)"/>
      <text x="54" y="25" fill="#fff" font-size="14" font-weight="700">HD interno</text>
      <text x="54" y="43" fill="#a5b4fc" font-size="12">outro disco</text>
    </g>
    <g transform="translate(1020 212)">
      <rect width="132" height="56" rx="12" fill="#1e1b4b" stroke="#4ade80" stroke-opacity="0.7"/>
      <path d="M17 19h24v8H17zM17 31h24v8H17zM22 23h.01M22 35h.01" fill="none" stroke="#4ade80" stroke-width="2.2" stroke-linecap="round"/>
      <text x="54" y="25" fill="#fff" font-size="14" font-weight="700">NAS</text>
      <text x="54" y="43" fill="#a5b4fc" font-size="12">na rede</text>
    </g>
  </g>
</svg>
