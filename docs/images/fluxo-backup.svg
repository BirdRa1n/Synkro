<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440" role="img" aria-labelledby="t d">
  <title id="t">Como uma execução acontece</title>
  <desc id="d">A origem passa por snapshot ou dump consistente, pelas guardas e pela cópia verificada por SHA-256, e é gravada em cada cofre de forma independente. Depois vêm retenção, verificação com reparo e alertas.</desc>
  <defs>
    <style>
      .t { font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif; }
      .bg { fill: #f8fafc; stroke: #e2e8f0; }
      .card { fill: #ffffff; stroke: #cbd5e1; }
      .num { fill: #4f46e5; }
      .numt { fill: #ffffff; font-size: 13px; font-weight: 700; }
      .h { fill: #0f172a; font-size: 16px; font-weight: 700; }
      .cap { fill: #6366f1; font-size: 11px; font-weight: 700; letter-spacing: 1.4px; }
      .b { fill: #475569; font-size: 13px; }
      .line { fill: none; stroke: #6366f1; stroke-width: 2.5; }
      .halo { fill: none; stroke: #6366f1; stroke-opacity: 0.13; stroke-width: 9; }
      .pulse { fill: #4f46e5; }
      .vault { fill: #ffffff; stroke: #16a34a; stroke-opacity: 0.55; }
      .vicon { fill: none; stroke: #16a34a; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
      .ok { fill: #16a34a; font-size: 12px; font-weight: 600; }
      .pill { fill: #eef2ff; stroke: #c7d2fe; }
      .pillt { fill: #3730a3; font-size: 13px; font-weight: 600; }
      .icon { fill: none; stroke: #4f46e5; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
      @media (prefers-color-scheme: dark) {
        .bg { fill: #0f172a; stroke: #1e293b; }
        .card { fill: #111827; stroke: #334155; }
        .num { fill: #6366f1; }
        .h { fill: #f1f5f9; }
        .cap { fill: #a5b4fc; }
        .b { fill: #94a3b8; }
        .line { stroke: #818cf8; }
        .halo { stroke: #818cf8; stroke-opacity: 0.18; }
        .pulse { fill: #c7d2fe; }
        .vault { fill: #111827; stroke: #4ade80; stroke-opacity: 0.6; }
        .vicon { stroke: #4ade80; }
        .ok { fill: #4ade80; }
        .pill { fill: #1e1b4b; stroke: #3730a3; }
        .pillt { fill: #c7d2fe; }
        .icon { stroke: #a5b4fc; }
      }
    </style>
    <path id="a1" d="M222 170 H 262"/>
    <path id="a2" d="M452 170 H 492"/>
    <path id="a3" d="M682 170 H 722"/>
    <path id="v1" d="M912 170 C 950 170, 950 92, 990 92"/>
    <path id="v2" d="M912 170 H 990"/>
    <path id="v3" d="M912 170 C 950 170, 950 248, 990 248"/>
  </defs>

  <rect class="bg" x="1" y="1" width="1198" height="438" rx="22"/>

  <g class="t">
    <text class="cap" x="32" y="44">COMO UMA EXECUÇÃO ACONTECE</text>

    <!-- 1. Origem -->
    <g transform="translate(32 92)">
      <rect class="card" width="190" height="156" rx="14"/>
      <circle class="num" cx="24" cy="26" r="12"/><text class="numt" x="24" y="31" text-anchor="middle">1</text>
      <path class="icon" d="M156 16h8l3 3h9a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-20a2 2 0 0 1-2-2V18a2 2 0 0 1 2-2z"/>
      <text class="h" x="18" y="68">Origem</text>
      <text class="b" x="18" y="94">Pastas do PDV (XML</text>
      <text class="b" x="18" y="112">fiscais, configuração)</text>
      <text class="b" x="18" y="130">e bancos de dados</text>
    </g>

    <!-- 2. Consistência -->
    <g transform="translate(262 92)">
      <rect class="card" width="190" height="156" rx="14"/>
      <circle class="num" cx="24" cy="26" r="12"/><text class="numt" x="24" y="31" text-anchor="middle">2</text>
      <path class="icon" d="M156 22a10 4 0 1 0 20 0 10 4 0 1 0-20 0v14c0 2.2 4.5 4 10 4s10-1.8 10-4V22"/>
      <text class="h" x="18" y="68">Consistência</text>
      <text class="b" x="18" y="94">Snapshot VSS para</text>
      <text class="b" x="18" y="112">arquivos abertos; dump</text>
      <text class="b" x="18" y="130">nativo para cada banco</text>
    </g>

    <!-- 3. Guardas -->
    <g transform="translate(492 92)">
      <rect class="card" width="190" height="156" rx="14"/>
      <circle class="num" cx="24" cy="26" r="12"/><text class="numt" x="24" y="31" text-anchor="middle">3</text>
      <path class="icon" d="M166 14l11 5v7c0 6-4.5 11-11 12-6.5-1-11-6-11-12v-7z"/>
      <text class="h" x="18" y="68">Guardas</text>
      <text class="b" x="18" y="94">Para tudo se a origem</text>
      <text class="b" x="18" y="112">sumir, esvaziar ou mudar</text>
      <text class="b" x="18" y="130">em massa (ransomware)</text>
    </g>

    <!-- 4. Cópia verificada -->
    <g transform="translate(722 92)">
      <rect class="card" width="190" height="156" rx="14"/>
      <circle class="num" cx="24" cy="26" r="12"/><text class="numt" x="24" y="31" text-anchor="middle">4</text>
      <path class="icon" d="M156 27l6 6 13-14"/>
      <text class="h" x="18" y="68">Cópia verificada</text>
      <text class="b" x="18" y="94">SHA-256 durante a cópia,</text>
      <text class="b" x="18" y="112">gravação forçada, troca</text>
      <text class="b" x="18" y="130">atômica; AES-256 opcional</text>
    </g>

    <!-- Ligações -->
    <use href="#a1" class="halo"/><use href="#a2" class="halo"/><use href="#a3" class="halo"/>
    <use href="#v1" class="halo"/><use href="#v2" class="halo"/><use href="#v3" class="halo"/>
    <use href="#a1" class="line"/><use href="#a2" class="line"/><use href="#a3" class="line"/>
    <use href="#v1" class="line"/><use href="#v2" class="line"/><use href="#v3" class="line"/>
    <g class="pulse">
      <circle r="4.5"><animateMotion dur="1.1s" repeatCount="indefinite"><mpath href="#a1"/></animateMotion></circle>
      <circle r="4.5"><animateMotion dur="1.1s" begin="-0.35s" repeatCount="indefinite"><mpath href="#a2"/></animateMotion></circle>
      <circle r="4.5"><animateMotion dur="1.1s" begin="-0.7s" repeatCount="indefinite"><mpath href="#a3"/></animateMotion></circle>
      <circle r="4.5"><animateMotion dur="1.6s" repeatCount="indefinite"><mpath href="#v1"/></animateMotion></circle>
      <circle r="4.5"><animateMotion dur="1.6s" begin="-0.5s" repeatCount="indefinite"><mpath href="#v2"/></animateMotion></circle>
      <circle r="4.5"><animateMotion dur="1.6s" begin="-1s" repeatCount="indefinite"><mpath href="#v3"/></animateMotion></circle>
    </g>

    <!-- 5. Cofres -->
    <text class="cap" x="990" y="44">5 · COFRES INDEPENDENTES</text>
    <g transform="translate(990 62)">
      <rect class="vault" width="178" height="60" rx="12"/>
      <path class="vicon" d="M14 30h24M17 30l3-10h12l3 10v8a1 1 0 0 1-1 1H15a1 1 0 0 1-1-1z" transform="translate(0 -3)"/>
      <text class="h" x="50" y="27" font-size="14">HD em rodízio</text>
      <text class="ok" x="50" y="45">pode sair do local</text>
    </g>
    <g transform="translate(990 140)">
      <rect class="vault" width="178" height="60" rx="12"/>
      <path class="vicon" d="M14 30h24M17 30l3-10h12l3 10v8a1 1 0 0 1-1 1H15a1 1 0 0 1-1-1z" transform="translate(0 -3)"/>
      <text class="h" x="50" y="27" font-size="14">HD interno</text>
      <text class="ok" x="50" y="45">outro disco físico</text>
    </g>
    <g transform="translate(990 218)">
      <rect class="vault" width="178" height="60" rx="12"/>
      <path class="vicon" d="M14 18h24v8H14zM14 30h24v8H14zM19 22h.01M19 34h.01"/>
      <text class="h" x="50" y="27" font-size="14">NAS / servidor</text>
      <text class="ok" x="50" y="45">outra máquina</text>
    </g>

    <!-- Depois -->
    <text class="cap" x="32" y="320">DEPOIS DE CADA EXECUÇÃO</text>
    <g transform="translate(32 338)">
      <rect class="pill" width="262" height="38" rx="19"/>
      <text class="pillt" x="131" y="24" text-anchor="middle">Retenção de versões e GFS</text>
      <rect class="pill" x="276" width="300" height="38" rx="19"/>
      <text class="pillt" x="426" y="24" text-anchor="middle">Verificação com reparo entre cofres</text>
      <rect class="pill" x="590" width="546" height="38" rx="19"/>
      <text class="pillt" x="863" y="24" text-anchor="middle">Alertas: bandeja · Visualizador de Eventos · e-mail · webhook · Telegram</text>
    </g>
    <text class="b" x="32" y="408">Nada é apagado na origem nem no cofre por engano: exclusões viram versões, e cada cofre se restaura sozinho, em qualquer computador.</text>
  </g>
</svg>
