# Configuração geral do Synkro — exemplo (docs/configuration.md §5).
# Copie para C:\ProgramData\Synkro\config\synkro.yml e ajuste os cofres.
version: 1

instance:
  name: "PDV Matriz"                  # aparece nos alertas e nos cofres

# Discos de destino. O cadastro inicial (verificações e criação do vault.json)
# é feito com `synkro-worker vault init`; o vault_id vem de `synkro-worker vault show`.
vaults:
  - id: hd-externo-1
    vault_id: 7f1c9a2e-3b0d-4c7e-9a51-0d2b6e1f4a10
    label: "HD Externo 1 (Seagate 2 TB)"
    rotation: true                    # disco que sai do local; ausência é esperada
    max_absence: 7d
    free_space_alert: 15%

  - id: hd-interno-2
    vault_id: 2b8e5d71-9c44-4f3a-8e0b-6a7c1d9f3e22
    label: "HD Interno 2 (WD 1 TB)"
    rotation: false
    max_absence: 1d

defaults:
  vaults: [hd-externo-1, hd-interno-2]
  min_vaults_ok: all
  timeout: 4h
  schedule_catch_up: true

alerts:
  no_success_for: 26h
  tray: true
  windows_event_log: true

# Avisos fora da máquina (docs/configuration.md §5.1). Senhas e tokens ficam no
# cofre de segredos: synkro-worker secret set <nome>. Teste: synkro-worker notify test
notifications:
  repeat_every: 24h                   # lembrete enquanto o alerta continuar aberto
  channels:
    - id: suporte
      type: email
      min_severity: warning
      daily_report: "08:00"           # resumo diário: prova de que o PDV está vivo
      smtp:
        host: smtp.example.com
        port: 587
        security: starttls
        user: backup@example.com
        password: { secret: smtp-suporte }
      from: backup@example.com
      to: [suporte@example.com]

    - id: celular-dono
      type: telegram
      min_severity: critical
      bot_token: { secret: telegram-bot }
      chat_id: "123456789"

maintenance:
  scrub:
    schedule: { weekly: { days: [sun], at: "03:00" } }
    sample: 10%
    repair_from_other_vaults: true

shutdown:
  countdown: 120s
  allowed_after: [noite]

logging:
  level: info
  keep: 30d
