# MySQL — exemplo (docs/configuration.md §7.2).
version: 1
id: retaguarda-mysql
name: "Retaguarda (MySQL)"
type: database
group: noite

engine: mysql
connection:
  host: 127.0.0.1
  port: 3306
  user: synkro_backup
  password: { secret: mysql-retaguarda }

databases: [retaguarda, fiscal]

mysql:
  single_transaction: true
  routines: true
  triggers: true
  events: true
  myisam_strategy: warn
  compression: zstd
  compression_level: 3
  extra_args: []

schedule:
  - daily: "22:10"
retention:
  keep_last: 7
  keep_daily: 14
  keep_monthly: 6
