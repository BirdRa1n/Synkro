# Banco PostgreSQL local — exemplo (docs/configuration.md §7.1).
version: 1
id: pdv-postgres
name: "Banco PDV (PostgreSQL)"
type: database
group: noite

engine: postgresql
connection:
  host: localhost
  port: 5432
  user: synkro_backup
  password: { secret: pg-pdv }
  sslmode: prefer
  connect_timeout: 15s
  retries: 3

databases:
  - name: pdv_vendas
  - name: pdv_estoque
    exclude_tables: ["public.log_*"]

postgresql:
  format: custom
  compress: 6
  include_globals: true
  jobs: 1
  extra_args: ["--no-comments"]

tools:
  pg_dump: auto

staging: local
schedule:
  - daily: "22:00"
timeout: 2h

retention:
  keep_last: 7
  keep_daily: 14
  keep_weekly: 8
  keep_monthly: 12

guards:
  on_empty_database: block
  on_missing_tables: warn
  min_size_ratio: 0.5

restore_test:
  enabled: true
  schedule: { weekly: { days: [sun], at: "04:00" } }
  connection: same
  exact_count_max_rows: 1000000
  checks:
    - name: "Existem vendas no último dia"
      sql: "SELECT count(*) > 0 FROM vendas WHERE data >= current_date - 1"
